<div class="equipo-contenedor fade-in">

  <div class="equipo-header">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <line x1="8" y1="21" x2="16" y2="21"/>
      <line x1="12" y1="17" x2="12" y2="21"/>
    </svg>
    <h2>Reporte de Equipo</h2>
  </div>

  <div class="buscar-seccion">
    <div class="buscar-wrap" id="buscarWrap">
      <svg class="buscar-icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        id="inputBuscar"
        placeholder="Buscar por descripción o UPC... (Enter para agregar)"
        autocomplete="off"
      >
      <div class="sugerencias-lista" id="sugerencias"></div>
    </div>
  </div>

  <div class="lista-seccion">
    <table class="equipo-tabla">
      <thead>
        <tr>
          <th>Descripción</th>
          <th>UPC / Código</th>
          <th>Cantidad</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="listaEquipos">
        <tr class="fila-vacia" id="filaVacia">
          <td colspan="4">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
            Agrega equipos usando el buscador
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="obs-seccion">
    <label for="observaciones">Observaciones</label>
    <textarea
      id="observaciones"
      maxlength="255"
      placeholder="Describe el problema o situación del equipo..."
      rows="4"
    ></textarea>
    <div class="obs-footer">
      <span id="obsContador">0 / 255</span>
    </div>
  </div>

  <div class="acciones-seccion">
    <button class="btn-reporte" id="btnGenerar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/>
        <line x1="16" y1="17" x2="8" y2="17"/>
        <polyline points="10 9 9 9 8 9"/>
      </svg>
      Generar Reporte
    </button>
  </div>

</div>
